<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #050D1C;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.6);
            --india-green: #138808;
            --india-green-glow: rgba(19, 136, 8, 0.6);
            --cyan-glow: #00F0FF;
            --text-sky-blue: #38BDF8;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Digital Earth Background Video Element */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: contain;
            background-color: #000000;
            pointer-events: none;
            filter: brightness(0.95) contrast(1.08);
            transition: transform 0.3s ease, object-fit 0.3s ease;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Top Left Side Branding with Glowing Effect */
        .top-left-brand {
            position: fixed;
            top: 28px;
            left: 32px;
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 25px rgba(0, 240, 255, 0.7), 0 0 45px rgba(230, 126, 34, 0.5);
            opacity: 1;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 100px;
            padding-bottom: 120px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hero Title Stack (Launching + Republic of India Token) */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Launching - Distinct Vivid Electric Cyan Color */
        .title-line-2 {
            font-size: 40px;
            font-weight: 700;
            color: #00F0FF;
            text-transform: lowercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
        }

        .title-line-3 {
            font-size: 68px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(19, 136, 8, 0.55);
            letter-spacing: -1px;
        }

        /* Stock Market Track Bar: Pure Black Inside Background with Cyan Borders */
        .stock-ticker-track-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 52px;
            background: #000000;
            border-top: 2.5px solid #00F0FF;
            border-bottom: 2.5px solid #00F0FF;
            box-shadow: 0 -4px 20px rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            overflow: hidden;
            z-index: 30;
        }

        /* 100% Truly Infinite 24/7 Sliding Marquee Container */
        .stock-ticker-content {
            display: flex;
            width: max-content;
        }

        .stock-ticker-group {
            display: flex;
            align-items: center;
            white-space: nowrap;
            animation: marqueeInfiniteLoop 16s linear infinite;
            will-change: transform;
        }

        /* Stock Exchange LED Amber Yellow Text Color */
        .stock-ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 0 45px;
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 800;
            color: #FFC700;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            user-select: none;
            text-shadow: none;
            filter: none;
        }

        /* 3 Dots One-by-One Animation */
        .animated-dots {
            display: inline-flex;
            margin-left: 4px;
        }

        .animated-dots span {
            opacity: 0;
            animation: dotFadeOneByOne 1.4s infinite ease-in-out;
        }

        .animated-dots span:nth-child(1) { animation-delay: 0s; }
        .animated-dots span:nth-child(2) { animation-delay: 0.3s; }
        .animated-dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotFadeOneByOne {
            0%, 100% { opacity: 0; }
            35%, 85% { opacity: 1; }
        }

        /* Star Divider Icons */
        .ticker-star-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            filter: none;
        }

        .star-left { fill: #00F0FF; }
        .star-right { fill: #FFC700; }

        /* Truly Unlimited Infinite Marquee Keyframes */
        @keyframes marqueeInfiniteLoop {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* Responsive Mobile View Adjustments */
        @media (max-width: 768px) {
            /* Perfectly Zoomed-Out Earth Video ONLY for Mobile View */
            #bg-video {
                object-fit: cover;
                transform: translate(-50%, -50%) scale(1.02);
            }

            .top-left-brand {
                top: 18px;
                left: 18px;
                font-size: 16px;
                letter-spacing: 1px;
            }

            .stock-ticker-track-bar {
                height: 44px;
                border-top-width: 2px;
                border-bottom-width: 2px;
            }

            .stock-ticker-group {
                animation-duration: 11s;
            }

            .stock-ticker-item {
                font-size: 15px;
                padding: 0 22px;
                letter-spacing: 2px;
                gap: 12px;
            }

            .ticker-star-icon {
                width: 14px;
                height: 14px;
            }

            .title-line-2 { font-size: 26px; }
            .title-line-3 { font-size: 38px; }
        }
    </style>
</head>
