<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #FFFFFF;
            --bg-surface: #F8FAFC;
            --bg-card: #FFFFFF;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.2);
            --india-green: #138808;
            --india-green-dark: #0E6B06;
            --india-blue: #1D4ED8;
            --india-blue-dark: #1E3A8A;
            --navy-blue: #0F172A;
            --gold-accent: #D97706;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border-color: #E2E8F0;
            --card-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.96);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: pageFadeIn 1s ease-out 0.1s forwards;
        }

        /* Smooth Page Entrance Keyframe Animations */
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heroReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .gradient-text {
            background: linear-gradient(135deg, #D35400 0%, #1D4ED8 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            border: none;
        }

        /* Keep on Connect - Blue Color Box */
        .btn-connect {
            background: linear-gradient(135deg, var(--india-blue) 0%, var(--india-blue-dark) 100%);
            color: #FFFFFF;
            box-shadow: 0 6px 24px rgba(29, 78, 216, 0.35);
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(29, 78, 216, 0.5);
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #60A5FA;
            box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.8);
            animation: pulse-animation 1.8s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.8); }
            70% { box-shadow: 0 0 0 10px rgba(96, 165, 250, 0); }
            100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
        }

        /* Header Navigation - Saffron Top Accent */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 4px solid var(--primary-saffron);
            box-shadow: 0 4px 20px rgba(230, 126, 34, 0.15);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-symbol {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-saffron) 0%, var(--primary-saffron-dark) 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 14px var(--saffron-glow);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--primary-saffron-dark);
            line-height: 1.2;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--navy-blue);
            font-weight: 700;
        }

        /* Home Hero Section with Light Faded Graph Image Background */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 160px;
            padding-bottom: 120px;
            text-align: center;
            background: 
                radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.86) 0%, rgba(255, 255, 255, 0.95) 80%),
                url('./faded_graph_bg.jpg') center/cover no-repeat;
        }

        .hero-centered-content {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 58px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 40px;
            letter-spacing: -1px;
            color: var(--navy-blue);
        }

        .hero-cta {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #FFFFFF;
            border: 1px solid var(--india-blue);
            padding: 16px 24px;
            border-radius: 14px;
            color: var(--navy-blue);
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Footer - Green Bottom Accent */
        footer {
            margin-top: auto;
            background: linear-gradient(135deg, #138808 0%, #0E6B06 100%);
            border-top: 3px solid #138808;
            padding: 32px 0;
            text-align: center;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 -4px 20px rgba(19, 136, 8, 0.2);
        }

        footer strong {
            color: #FFE082;
        }

        @media (max-width: 992px) {
            .hero-title {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar - Saffron Top Band -->
    <header>
        <div class="container nav-container">
            <a href="#home" class="logo-group">
                <div class="logo-symbol">🇮🇳</div>
                <div class="logo-text">
                    <span class="logo-title">National Welfare Trust</span>
                    <span class="logo-subtitle">Republic of India Token</span>
                </div>
            </a>

            <button class="btn btn-connect" onclick="triggerDemoConnect()">
                <span class="pulse-dot"></span> Keep on Connect
            </button>
        </div>
    </header>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Page Section with Faded Graph Photo Background -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        National Welfare Trust launching <span class="gradient-text">Republic of India Token</span>
                    </h1>
                    
                    <div class="hero-cta">
                        <button class="btn btn-connect" onclick="triggerDemoConnect()">
                            🔗 Keep on Connect
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Keep on Connect Active!</span>
    </div>

    <!-- Footer - Green Bottom Band -->
    <footer>
        <div class="container">
            &copy; 2026 National Welfare Trust. Republic of India Token ($ROIT). All rights reserved. | <strong>Keep on Connect</strong> Active.
        </div>
    </footer>

    <!-- Interactive JavaScript -->
    <script>
        /* CONNECT DEMO HANDLER */
        function triggerDemoConnect() {
            showToast("🔗 Keep on Connect (Demo mode active for future launch)");
        }

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>
</body>
</html>
