<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #050D1C;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.6);
            --india-green: #138808;
            --india-green-glow: rgba(19, 136, 8, 0.6);
            --cyan-glow: #00F0FF;
            --text-sky-blue: #38BDF8;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Digital Earth Background Video Element */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: contain;
            background-color: #000000;
            pointer-events: none;
            filter: brightness(0.95) contrast(1.08);
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 100px;
            padding-bottom: 120px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 30px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(230, 126, 34, 0.4);
        }

        /* Launching - Distinct Vivid Electric Cyan Color */
        .title-line-2 {
            font-size: 36px;
            font-weight: 700;
            color: #00F0FF;
            text-transform: lowercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
        }

        .title-line-3 {
            font-size: 66px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(19, 136, 8, 0.55);
            letter-spacing: -1px;
        }

        /* Bottom Center Typewriter Animation Container */
        .connect-bottom-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            pointer-events: none;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        /* Neat Crisp Sky Blue Typewriter Text */
        .connect-typewriter-text {
            font-size: 22px;
            font-weight: 600;
            color: #38BDF8;
            letter-spacing: 2px;
            user-select: none;
            white-space: nowrap;
            display: inline-block;
            min-height: 32px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        @media (max-width: 992px) {
            .title-line-1 { font-size: 38px; }
            .title-line-2 { font-size: 26px; }
            .title-line-3 { font-size: 42px; }
            .connect-typewriter-text { font-size: 18px; }
            .connect-bottom-container { bottom: 28px; }
        }
    </style>
</head>
<body>

    <!-- Full Screen Background Video (Digital World Earth Spinning) -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="./earth_background.mp4" type="video/mp4">
        <source src="./Digital World Earth Spinning Black and White_1080p.mp4" type="video/mp4">
    </video>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Center Typewriter Animation: Keep on Connect ... (No Cursor) -->
    <div class="connect-bottom-container">
        <span id="animated-connect-text" class="connect-typewriter-text"></span>
    </div>

    <!-- Typewriter Script Engine -->
    <script>
        function startTypewriterAnimation() {
            const textElement = document.getElementById('animated-connect-text');
            if (!textElement) return;

            const fullText = "Keep on Connect ...";
            let index = 0;
            let isDeleting = false;
            const typingSpeed = 90;   // ms per letter reveal
            const deletingSpeed = 45; // ms per letter hide
            const pauseDelay = 2000;  // ms to stay visible at "Keep on Connect ..."

            function typeStep() {
                if (!isDeleting) {
                    // Revealing one by one
                    textElement.textContent = fullText.substring(0, index + 1);
                    index++;

                    if (index === fullText.length) {
                        // Reached full text with three dots: pause, then start deleting
                        isDeleting = true;
                        setTimeout(typeStep, pauseDelay);
                        return;
                    }
                } else {
                    // Hiding one by one
                    textElement.textContent = fullText.substring(0, index - 1);
                    index--;

                    if (index === 0) {
                        // Reached start: pause briefly, then start typing again
                        isDeleting = false;
                        setTimeout(typeStep, 600);
                        return;
                    }
                }

                const currentSpeed = isDeleting ? deletingSpeed : typingSpeed;
                setTimeout(typeStep, currentSpeed);
            }

            typeStep();
        }

        window.addEventListener('DOMContentLoaded', startTypewriterAnimation);
    </script>
</body>
</html>
