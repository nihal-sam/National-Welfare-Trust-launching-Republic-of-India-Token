<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Three.js CDN for Procedural Photorealistic 3D Earth Background Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-page: #01040A;
            --bg-surface: #070F1E;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.6);
            --india-green: #138808;
            --india-green-glow: rgba(19, 136, 8, 0.6);
            --cyan-glow: #00F0FF;
            --text-amber: #FFB703;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Canvas for Procedural 3D Earth Animation Background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Video element zoom out styling */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%) scale(0.85);
            object-fit: cover;
            pointer-events: none;
            filter: brightness(0.95) contrast(1.05);
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Keep on Connect - Plain Normal Text (Amber Gold Color, No Glow, No Box, No Click) */
        .connect-text-only {
            font-size: 20px;
            font-weight: 600;
            color: #FFB703;
            letter-spacing: 0.8px;
            user-select: none;
            background: none;
            border: none;
            padding: 0;
            box-shadow: none;
            text-shadow: none;
            display: inline-block;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 100px;
            padding-bottom: 100px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 52px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(230, 126, 34, 0.4);
        }

        /* Launching - Distinct Vivid Electric Cyan Color */
        .title-line-2 {
            font-size: 36px;
            font-weight: 700;
            color: #00F0FF;
            text-transform: lowercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
        }

        .title-line-3 {
            font-size: 66px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(19, 136, 8, 0.55);
            letter-spacing: -1px;
        }

        .hero-cta {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 992px) {
            .title-line-1 { font-size: 38px; }
            .title-line-2 { font-size: 26px; }
            .title-line-3 { font-size: 42px; }
        }
    </style>
</head>
<body>

    <!-- Canvas for Photorealistic Procedural 3D Earth Background -->
    <div id="canvas-container"></div>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                    
                    <div class="hero-cta">
                        <div class="connect-text-only">
                            Keep on Connect
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Photorealistic Procedural 3D Earth Engine (Zoomed Out Perspective) -->
    <script>
        function initGoldenRimEarthEngine() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            if (typeof THREE === 'undefined') {
                container.style.background = 'radial-gradient(circle at 50% 50%, #041224 0%, #01040A 100%)';
                return;
            }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Zoomed Out Camera Position (from 4.2 to 5.4 for perfect zoomed-out framing)
            camera.position.z = 5.4;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 1. GENERATE HIGH-RESOLUTION EQUIRECTANGULAR MAP CANVAS WITH GOLDEN CITY LIGHTS
            const mapCanvas = document.createElement('canvas');
            mapCanvas.width = 2048;
            mapCanvas.height = 1024;
            const ctx = mapCanvas.getContext('2d');

            // Deep Metallic Ocean Base
            const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
            oceanGrad.addColorStop(0, '#010612');
            oceanGrad.addColorStop(0.5, '#04162B');
            oceanGrad.addColorStop(1, '#010612');
            ctx.fillStyle = oceanGrad;
            ctx.fillRect(0, 0, 2048, 1024);

            // Continents Topology (Dark Silhouettes)
            ctx.fillStyle = '#081D33';
            ctx.beginPath();
            ctx.ellipse(1450, 420, 320, 220, 0, 0, Math.PI * 2); // Asia
            ctx.fill();

            // India Peninsula Region
            ctx.fillStyle = '#0C2A4A';
            ctx.beginPath();
            ctx.moveTo(1360, 400);
            ctx.lineTo(1440, 530);
            ctx.lineTo(1390, 580);
            ctx.lineTo(1310, 480);
            ctx.closePath();
            ctx.fill();

            // Europe & Africa
            ctx.fillStyle = '#07182B';
            ctx.beginPath();
            ctx.ellipse(1080, 340, 190, 130, 0, 0, Math.PI * 2); // Europe
            ctx.ellipse(1060, 620, 220, 260, 0, 0, Math.PI * 2); // Africa
            ctx.fill();

            // Americas
            ctx.fillStyle = '#061526';
            ctx.beginPath();
            ctx.ellipse(540, 350, 250, 180, 0, 0, Math.PI * 2);
            ctx.ellipse(680, 690, 190, 260, 0, 0, Math.PI * 2);
            ctx.fill();

            // Australia & Indonesia
            ctx.fillStyle = '#081A2D';
            ctx.beginPath();
            ctx.ellipse(1690, 720, 160, 120, 0, 0, Math.PI * 2);
            ctx.fill();

            // Intense Golden & Saffron Night City Lights Networks
            for (let i = 0; i < 1800; i++) {
                let x = Math.random() * 2048;
                let y = Math.random() * 1024;
                ctx.fillStyle = Math.random() > 0.25 ? '#FF9933' : '#FFD54F';
                let sz = 1.8 + Math.random() * 1.5;
                ctx.fillRect(x, y, sz, sz);
            }

            // India Glowing Golden City Lights Cluster
            let ix = 1370, iy = 470;
            for(let i=0; i<300; i++) {
                let x = ix + (Math.random() - 0.5) * 90;
                let y = iy + (Math.random() - 0.5) * 70;
                ctx.fillStyle = i % 2 === 0 ? '#FF9933' : '#FFC107';
                ctx.beginPath();
                ctx.arc(x, y, 2.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Polar Caps
            ctx.fillStyle = '#89B5DB';
            ctx.fillRect(0, 975, 2048, 49);
            ctx.fillRect(0, 0, 2048, 30);

            const earthTexture = new THREE.CanvasTexture(mapCanvas);

            // 2. CREATE 3D GLOBE SPHERE (Zoomed Out Radius)
            const sphereRadius = 1.45;
            const earthGeo = new THREE.SphereGeometry(sphereRadius, 128, 128);
            const earthMat = new THREE.MeshPhongMaterial({
                map: earthTexture,
                emissive: new THREE.Color(0x221104),
                emissiveIntensity: 0.95,
                shininess: 35,
                specular: new THREE.Color(0x336699)
            });
            const earthMesh = new THREE.Mesh(earthGeo, earthMat);
            
            // Set realistic planetary axial tilt
            earthMesh.rotation.z = 0.41;
            earthMesh.rotation.x = 0.15;
            scene.add(earthMesh);

            // 3. PHOTOREALISTIC GOLDEN RIM FRESNEL BACKLIGHT SHADER
            const rimShaderMat = new THREE.ShaderMaterial({
                uniforms: {
                    c: { type: "f", value: 0.65 },
                    p: { type: "f", value: 3.2 },
                    glowColor: { type: "c", value: new THREE.Color(0xFF9933) }, // Saffron/Golden Halo
                    viewVector: { type: "v3", value: camera.position }
                },
                vertexShader: `
                    uniform vec3 viewVector;
                    uniform float c;
                    uniform float p;
                    varying float intensity;
                    void main() {
                        vec3 vNormal = normalize(normalMatrix * normal);
                        vec3 vNormel = normalize(normalMatrix * viewVector);
                        intensity = pow(c - dot(vNormal, vNormel), p);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 glowColor;
                    varying float intensity;
                    void main() {
                        vec3 glow = glowColor * intensity;
                        gl_FragColor = vec4(glow, intensity * 0.98);
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });

            const rimGeo = new THREE.SphereGeometry(sphereRadius * 1.05, 128, 128);
            const rimMesh = new THREE.Mesh(rimGeo, rimShaderMat);
            rimMesh.rotation.z = 0.41;
            rimMesh.rotation.x = 0.15;
            scene.add(rimMesh);

            // 4. DYNAMIC 3D ATMOSPHERIC CLOUDS SPHERE LAYER
            const cloudCanvas = document.createElement('canvas');
            cloudCanvas.width = 2048;
            cloudCanvas.height = 1024;
            const cCtx = cloudCanvas.getContext('2d');
            cCtx.fillStyle = 'transparent';
            cCtx.fillRect(0, 0, 2048, 1024);
            cCtx.fillStyle = 'rgba(255, 255, 255, 0.35)';

            for(let i=0; i<850; i++) {
                let cx = Math.random() * 2048;
                let cy = Math.random() * 1024;
                let rx = 40 + Math.random() * 100;
                let ry = 14 + Math.random() * 32;
                cCtx.beginPath();
                cCtx.ellipse(cx, cy, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
                cCtx.fill();
            }
            const cloudTexture = new THREE.CanvasTexture(cloudCanvas);

            const cloudGeo = new THREE.SphereGeometry(sphereRadius * 1.025, 128, 128);
            const cloudMat = new THREE.MeshPhongMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: 0.65,
                blending: THREE.AdditiveBlending
            });
            const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
            cloudMesh.rotation.z = 0.41;
            cloudMesh.rotation.x = 0.15;
            scene.add(cloudMesh);

            // 5. STARRY SPACE PARTICLES BACKGROUND
            const starGeo = new THREE.BufferGeometry();
            const starCount = 600;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starPos[i] = (Math.random() - 0.5) * 14;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.02, color: 0xFFFFFF, transparent: true, opacity: 0.8 });
            const starMesh = new THREE.Points(starGeo, starMat);
            scene.add(starMesh);

            // 6. LIGHTING SETUP
            const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.55);
            scene.add(ambientLight);

            // Intense Golden Rim Directional Backlight
            const rimLight = new THREE.DirectionalLight(0xFF9933, 2.5);
            rimLight.position.set(-6, 5, -5);
            scene.add(rimLight);

            const fillLight = new THREE.DirectionalLight(0x2563EB, 0.9);
            fillLight.position.set(5, 2, 5);
            scene.add(fillLight);

            // 7. REAL 3D SPHERICAL PLANETARY ROTATION ANIMATION (Continuous Y-axis rotation)
            function animate() {
                requestAnimationFrame(animate);
                earthMesh.rotation.y += 0.0028;
                cloudMesh.rotation.y += 0.0033;
                starMesh.rotation.y -= 0.0003;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initGoldenRimEarthEngine();
        });
    </script>
</body>
</html>
