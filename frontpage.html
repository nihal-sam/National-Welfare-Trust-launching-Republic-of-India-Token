<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #050D1C;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.6);
            --india-green: #138808;
            --india-green-glow: rgba(19, 136, 8, 0.6);
            --cyan-glow: #00F0FF;
            --text-sky-blue: #38BDF8;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Digital Earth Background Video Element */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: contain;
            background-color: #000000;
            pointer-events: none;
            filter: brightness(0.95) contrast(1.08);
            transition: transform 0.3s ease, object-fit 0.3s ease;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 100px;
            padding-bottom: 120px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 30px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(230, 126, 34, 0.4);
        }

        /* Launching - Distinct Vivid Electric Cyan Color */
        .title-line-2 {
            font-size: 36px;
            font-weight: 700;
            color: #00F0FF;
            text-transform: lowercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
        }

        .title-line-3 {
            font-size: 66px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(19, 136, 8, 0.55);
            letter-spacing: -1px;
        }

        /* Ultra-Premium Stock Market Ticker Track Bar */
        .stock-ticker-track-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 56px;
            background: linear-gradient(180deg, rgba(8, 20, 42, 0.92) 0%, rgba(2, 6, 16, 0.98) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 -6px 30px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            overflow: hidden;
            z-index: 30;
            mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
        }

        /* Continuous Stock Ticker Marquee Wrapper */
        .stock-ticker-content {
            display: flex;
            align-items: center;
            white-space: nowrap;
            animation: stockMarqueeLoop 20s linear infinite;
            will-change: transform;
        }

        .stock-ticker-group {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .stock-ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 0 45px;
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            user-select: none;
        }

        /* High-Definition Premium Color Palettes */
        .stock-ticker-item.color-tricolor-gradient {
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #00E676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 153, 51, 0.3));
        }

        .stock-ticker-item.color-electric-cyan {
            color: #00F0FF;
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.4);
        }

        .stock-ticker-item.color-gold-saffron {
            color: #FFB703;
            text-shadow: 0 0 14px rgba(255, 183, 3, 0.4);
        }

        /* 3 Dots One-by-One Animation */
        .animated-dots {
            display: inline-flex;
            margin-left: 4px;
        }

        .animated-dots span {
            opacity: 0;
            animation: dotFadeOneByOne 1.4s infinite ease-in-out;
        }

        .animated-dots span:nth-child(1) { animation-delay: 0s; }
        .animated-dots span:nth-child(2) { animation-delay: 0.3s; }
        .animated-dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotFadeOneByOne {
            0%, 100% { opacity: 0; }
            35%, 85% { opacity: 1; }
        }

        /* Star Divider Icons with Premium Ambient Glow */
        .ticker-star-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            filter: drop-shadow(0 0 6px currentColor);
        }

        .star-cyan { fill: #00F0FF; color: #00F0FF; }
        .star-green { fill: #00E676; color: #00E676; }
        .star-saffron { fill: #FF9933; color: #FF9933; }

        /* Seamless Infinite Stock Ticker Keyframe */
        @keyframes stockMarqueeLoop {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* Responsive Mobile View Adjustments */
        @media (max-width: 768px) {
            /* Perfectly Zoomed-Out Earth Video ONLY for Mobile View */
            #bg-video {
                object-fit: cover;
                transform: translate(-50%, -50%) scale(1.02);
            }

            .stock-ticker-track-bar {
                height: 46px;
            }

            .stock-ticker-content {
                animation-duration: 13s;
            }

            .stock-ticker-item {
                font-size: 15px;
                padding: 0 22px;
                letter-spacing: 2px;
                gap: 12px;
            }

            .ticker-star-icon {
                width: 14px;
                height: 14px;
            }

            .title-line-1 { font-size: 34px; }
            .title-line-2 { font-size: 22px; }
            .title-line-3 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <!-- Full Screen Background Video (Digital World Earth Spinning) -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="./earth_background.mp4" type="video/mp4">
        <source src="./Digital World Earth Spinning Black and White_1080p.mp4" type="video/mp4">
    </video>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                </div>
            </div>
        </section>
    </main>

    <!-- Ultra-Premium Stock Market Style Track Bar -->
    <div class="stock-ticker-track-bar">
        <div class="stock-ticker-content">

            <div class="stock-ticker-group">
                <div class="stock-ticker-item color-tricolor-gradient">
                    <svg class="ticker-star-icon star-cyan" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>

                <div class="stock-ticker-item color-electric-cyan">
                    <svg class="ticker-star-icon star-green" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                    <span>KEEP ON CONNECT <span class="animated-dots"><span>.</span><span>.</span><span>.</span></span></span>

                </div>
                <div class="stock-ticker-item color-gold-saffron">
                    <svg class="ticker-star-icon star-cyan" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                    <span>KEEP ON CONNECT <span class="animated-dots"><span>.</span><span>.</span><span>.</span></span></span>
                    <svg class="ticker-star-icon star-green" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                </div>
            </div>

            <!-- Identical Second Group for 100% Seamless Infinite Looping -->
            <div class="stock-ticker-group">
                <div class="stock-ticker-item color-tricolor-gradient">
                    <svg class="ticker-star-icon star-cyan" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                    <span>KEEP ON CONNECT <span class="animated-dots"><span>.</span><span>.</span><span>.</span></span></span>
                    <svg class="ticker-star-icon star-saffron" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                </div>
                <div class="stock-ticker-item color-electric-cyan">
                    <svg class="ticker-star-icon star-green" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                    <span>KEEP ON CONNECT <span class="animated-dots"><span>.</span><span>.</span><span>.</span></span></span>
                    <svg class="ticker-star-icon star-saffron" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                </div>
                <div class="stock-ticker-item color-gold-saffron">
                    <svg class="ticker-star-icon star-cyan" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                    <span>KEEP ON CONNECT <span class="animated-dots"><span>.</span><span>.</span><span>.</span></span></span>
                    <svg class="ticker-star-icon star-green" viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
