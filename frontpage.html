<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Three.js CDN for Photorealistic 3D Golden Rim Earth -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-page: #01040A;
            --bg-surface: #070F1E;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.6);
            --india-green: #138808;
            --india-green-glow: rgba(19, 136, 8, 0.6);
            --india-blue: #1D4ED8;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 3D WebGL Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Keep on Connect - Pure Neon Text */
        .connect-text-only {
            font-size: 24px;
            font-weight: 800;
            color: #60A5FA;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.8), 0 0 40px rgba(29, 78, 216, 0.6);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .connect-text-only:hover {
            color: #93C5FD;
            text-shadow: 0 0 30px rgba(147, 197, 253, 1), 0 0 60px rgba(96, 165, 250, 0.9);
            transform: translateY(-3px) scale(1.05);
        }

        /* Futuristic Neon Glass Header Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            z-index: 1000;
            background: rgba(1, 4, 10, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 2px solid #E67E22;
            box-shadow: 0 0 30px rgba(230, 126, 34, 0.55), 0 4px 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-neon-glow {
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #FF9933 50%, transparent 100%);
            box-shadow: 0 0 15px #FF9933;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 150px;
            padding-bottom: 100px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 52px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(230, 126, 34, 0.4);
        }

        .title-line-2 {
            font-size: 36px;
            font-weight: 700;
            color: #E67E22;
            text-transform: lowercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(230, 126, 34, 0.85);
        }

        .title-line-3 {
            font-size: 66px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(19, 136, 8, 0.55);
            letter-spacing: -1px;
        }

        .hero-cta {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #070F1E;
            border: 1px solid #1D4ED8;
            padding: 16px 24px;
            border-radius: 14px;
            color: #FFFFFF;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(29, 78, 216, 0.5);
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Futuristic Neon Glass Footer Bar */
        footer {
            position: relative;
            z-index: 20;
            margin-top: auto;
            background: rgba(1, 4, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 2px solid #138808;
            padding: 28px 0;
            text-align: center;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(19, 136, 8, 0.55), 0 -4px 20px rgba(0, 0, 0, 0.8);
        }

        .footer-neon-glow {
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #138808 50%, transparent 100%);
            box-shadow: 0 0 15px #138808;
        }

        .footer-text {
            color: #E2E8F0;
            text-shadow: 0 0 12px rgba(19, 136, 8, 0.7);
        }

        @media (max-width: 992px) {
            .title-line-1 { font-size: 38px; }
            .title-line-2 { font-size: 26px; }
            .title-line-3 { font-size: 42px; }
        }
    </style>
</head>
<body>

    <!-- 3D Golden Rim Earth Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Navigation Bar - Futuristic Neon Glass Bar -->
    <header>
        <div class="header-neon-glow"></div>
    </header>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                    
                    <div class="hero-cta">
                        <div class="connect-text-only" onclick="triggerDemoConnect()">
                            🔗 Keep on Connect
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Keep on Connect Active!</span>
    </div>

    <!-- Footer - Futuristic Neon Glass Bar -->
    <footer>
        <div class="footer-neon-glow"></div>
        <div class="container footer-text">
            &copy; 2026 National Welfare Trust. Republic of India Token.
        </div>
    </footer>

    <!-- Interactive Photorealistic 3D Golden Rim Earth Script -->
    <script>
        function initGoldenRim3DEarth() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            if (typeof THREE === 'undefined') {
                container.style.background = 'radial-gradient(circle at 50% 50%, #041224 0%, #01040A 100%)';
                return;
            }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 1. GENERATE GOLDEN NIGHT CITY LIGHTS EARTH TEXTURE MAP
            const earthCanvas = document.createElement('canvas');
            earthCanvas.width = 2048;
            earthCanvas.height = 1024;
            const eCtx = earthCanvas.getContext('2d');

            // Deep Metallic Night Ocean
            const oceanGrad = eCtx.createLinearGradient(0, 0, 0, 1024);
            oceanGrad.addColorStop(0, '#010814');
            oceanGrad.addColorStop(0.5, '#04162B');
            oceanGrad.addColorStop(1, '#010814');
            eCtx.fillStyle = oceanGrad;
            eCtx.fillRect(0, 0, 2048, 1024);

            // Dark Charcoal/Navy Landmass Silhouettes
            eCtx.fillStyle = '#091B2E';

            // Asia & Indian Subcontinent Region
            eCtx.beginPath();
            eCtx.ellipse(1420, 420, 280, 200, 0, 0, Math.PI * 2);
            eCtx.fill();

            // India Peninsula Detail
            eCtx.fillStyle = '#0E243B';
            eCtx.beginPath();
            eCtx.moveTo(1360, 410);
            eCtx.lineTo(1430, 520);
            eCtx.lineTo(1390, 560);
            eCtx.lineTo(1320, 480);
            eCtx.closePath();
            eCtx.fill();

            // Europe & Africa
            eCtx.fillStyle = '#081728';
            eCtx.beginPath();
            eCtx.ellipse(1080, 360, 170, 120, 0, 0, Math.PI * 2); // Europe
            eCtx.ellipse(1060, 620, 200, 250, 0, 0, Math.PI * 2); // Africa
            eCtx.fill();

            // Americas
            eCtx.fillStyle = '#081626';
            eCtx.beginPath();
            eCtx.ellipse(540, 360, 230, 170, 0, 0, Math.PI * 2); // North America
            eCtx.ellipse(680, 680, 170, 250, 0, 0, Math.PI * 2); // South America
            eCtx.fill();

            // Australia & Indonesia
            eCtx.fillStyle = '#0A1B2C';
            eCtx.beginPath();
            eCtx.ellipse(1680, 720, 150, 110, 0, 0, Math.PI * 2);
            eCtx.fill();

            // Intense Golden/Saffron City Lights Network (Matching Reference Image)
            for (let i = 0; i < 1100; i++) {
                let x = Math.random() * 2048;
                let y = Math.random() * 1024;
                eCtx.fillStyle = Math.random() > 0.3 ? '#FF9933' : '#FFC107';
                eCtx.fillRect(x, y, 2.2, 2.2);
            }

            // India Golden Light Cluster
            let ix = 1370, iy = 470;
            for(let i=0; i<160; i++) {
                let x = ix + (Math.random() - 0.5) * 85;
                let y = iy + (Math.random() - 0.5) * 65;
                eCtx.fillStyle = i % 2 === 0 ? '#FF9933' : '#FFD54F';
                eCtx.beginPath();
                eCtx.arc(x, y, 2.5, 0, Math.PI * 2);
                eCtx.fill();
            }

            // Polar Caps
            eCtx.fillStyle = '#A0C4DF';
            eCtx.fillRect(0, 975, 2048, 49);
            eCtx.fillRect(0, 0, 2048, 30);

            const earthTexture = new THREE.CanvasTexture(earthCanvas);

            // 2. CREATE EARTH MESH
            const earthGeo = new THREE.SphereGeometry(1.35, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({
                map: earthTexture,
                emissive: new THREE.Color(0x1a0d02),
                emissiveIntensity: 0.8,
                shininess: 25,
                specular: new THREE.Color(0x336699)
            });
            const earth = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earth);

            // 3. CUSTOM SHADER FOR GOLDEN/SAFFRON GLOWING RIM BACKLIGHT (Matching Reference Image)
            const rimShaderMat = new THREE.ShaderMaterial({
                uniforms: {
                    c: { type: "f", value: 0.65 },
                    p: { type: "f", value: 3.2 },
                    glowColor: { type: "c", value: new THREE.Color(0xFF9933) },
                    viewVector: { type: "v3", value: camera.position }
                },
                vertexShader: `
                    uniform vec3 viewVector;
                    uniform float c;
                    uniform float p;
                    varying float intensity;
                    void main() {
                        vec3 vNormal = normalize(normalMatrix * normal);
                        vec3 vNormel = normalize(normalMatrix * viewVector);
                        intensity = pow(c - dot(vNormal, vNormel), p);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 glowColor;
                    varying float intensity;
                    void main() {
                        vec3 glow = glowColor * intensity;
                        gl_FragColor = vec4(glow, intensity * 0.95);
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });

            const rimGeo = new THREE.SphereGeometry(1.42, 64, 64);
            const rimMesh = new THREE.Mesh(rimGeo, rimShaderMat);
            scene.add(rimMesh);

            // 4. SOFT SWIRLING ATMOSPHERIC CLOUDS
            const cloudCanvas = document.createElement('canvas');
            cloudCanvas.width = 2048;
            cloudCanvas.height = 1024;
            const cCtx = cloudCanvas.getContext('2d');
            cCtx.fillStyle = 'transparent';
            cCtx.fillRect(0, 0, 2048, 1024);
            cCtx.fillStyle = 'rgba(255, 255, 255, 0.35)';

            for(let i=0; i<650; i++) {
                let cx = Math.random() * 2048;
                let cy = Math.random() * 1024;
                let rx = 40 + Math.random() * 95;
                let ry = 14 + Math.random() * 30;
                cCtx.beginPath();
                cCtx.ellipse(cx, cy, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
                cCtx.fill();
            }
            const cloudTexture = new THREE.CanvasTexture(cloudCanvas);

            const cloudGeo = new THREE.SphereGeometry(1.38, 64, 64);
            const cloudMat = new THREE.MeshPhongMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });
            const clouds = new THREE.Mesh(cloudGeo, cloudMat);
            scene.add(clouds);

            // 5. STARRY SPACE PARTICLES
            const starGeo = new THREE.BufferGeometry();
            const starCount = 450;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starPos[i] = (Math.random() - 0.5) * 10;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.02, color: 0xFFFFFF, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // 6. BACKLIGHTING & AMBIENT LIGHTING
            const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.5);
            scene.add(ambientLight);

            // Strong Golden Rim Directional Backlight
            const rimLight = new THREE.DirectionalLight(0xFF9933, 2.2);
            rimLight.position.set(-5, 4, -4);
            scene.add(rimLight);

            const fillLight = new THREE.DirectionalLight(0x2563EB, 0.8);
            fillLight.position.set(4, 2, 4);
            scene.add(fillLight);

            // 7. REALISTIC SLOW PLANETARY ROTATION ANIMATION
            function animate() {
                requestAnimationFrame(animate);
                earth.rotation.y += 0.0012;
                clouds.rotation.y += 0.0015;
                stars.rotation.y -= 0.0003;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* CONNECT DEMO HANDLER */
        function triggerDemoConnect() {
            showToast("🔗 Keep on Connect (Demo mode active for future launch)");
        }

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initGoldenRim3DEarth();
        });
    </script>
</body>
</html>
