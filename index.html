<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #050D1C;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.6);
            --india-green: #138808;
            --india-green-glow: rgba(19, 136, 8, 0.6);
            --cyan-glow: #00F0FF;
            --text-sky-blue: #38BDF8;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Digital Earth Background Video Element (Desktop: Un-zoomed Contain) */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: contain;
            background-color: #000000;
            pointer-events: none;
            filter: brightness(0.95) contrast(1.08);
            transition: transform 0.3s ease, object-fit 0.3s ease;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 100px;
            padding-bottom: 120px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 30px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(230, 126, 34, 0.4);
        }

        /* Launching - Distinct Vivid Electric Cyan Color */
        .title-line-2 {
            font-size: 36px;
            font-weight: 700;
            color: #00F0FF;
            text-transform: lowercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
        }

        .title-line-3 {
            font-size: 66px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(19, 136, 8, 0.55);
            letter-spacing: -1px;
        }

        /* Bottom News Ticker Marquee Container (Moving Left to Right) */
        .connect-ticker-container {
            position: fixed;
            bottom: 36px;
            left: 0;
            width: 100vw;
            overflow: hidden;
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
        }

        .connect-ticker-content {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            animation: marqueeLeftToRight 16s linear infinite;
            will-change: transform;
        }

        .connect-ticker-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Text with Exact 100px Gap on Left and Right */
        .connect-text-phrase {
            margin-left: 100px;
            margin-right: 100px;
            font-size: 22px;
            font-weight: 700;
            color: #38BDF8;
            letter-spacing: 2px;
            user-select: none;
            text-shadow: none;
            display: inline-flex;
            align-items: center;
        }

        /* 3 Dots One-by-One Animation */
        .animated-dots {
            display: inline-flex;
            margin-left: 6px;
        }

        .animated-dots span {
            opacity: 0;
            animation: dotFadeOneByOne 1.4s infinite ease-in-out;
        }

        .animated-dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .animated-dots span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .animated-dots span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dotFadeOneByOne {
            0%, 100% { opacity: 0; }
            35%, 85% { opacity: 1; }
        }

        /* Star Icons (Left & Right) */
        .ticker-icon {
            width: 22px;
            height: 22px;
            display: inline-block;
            vertical-align: middle;
        }

        .icon-star-left {
            fill: #00F0FF; /* Electric Cyan Star */
        }

        .icon-star-right {
            fill: #FF9933; /* Saffron Gold Star */
        }

        /* News Ticker Motion: Left to Right Loop */
        @keyframes marqueeLeftToRight {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100vw);
            }
        }

        /* Responsive Mobile View Adjustments */
        @media (max-width: 768px) {
            /* Perfectly Balanced Zoomed Earth Video ONLY for Mobile View */
            #bg-video {
                object-fit: cover;
                transform: translate(-50%, -50%) scale(1.08);
            }

            .title-line-1 { font-size: 34px; }
            .title-line-2 { font-size: 22px; }
            .title-line-3 { font-size: 36px; }
            .connect-text-phrase { 
                font-size: 16px; 
                margin-left: 50px;
                margin-right: 50px;
            }
            .connect-ticker-container { bottom: 24px; }
            .ticker-icon { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>

    <!-- Full Screen Background Video (Digital World Earth Spinning) -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="./earth_background.mp4" type="video/mp4">
        <source src="./Digital World Earth Spinning Black and White_1080p.mp4" type="video/mp4">
    </video>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                </div>
            </div>
        </section>
    </main>

    <!-- News Ticker Marquee with Star Icons & Exact 100px Gaps (Moving Left to Right) -->
    <div class="connect-ticker-container">
        <div class="connect-ticker-content">
            <div class="connect-ticker-item">
                <!-- Left Star Icon -->
                <svg class="ticker-icon icon-star-left" viewBox="0 0 24 24">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
                </svg>

                <!-- Text with Exact 100px Left & Right Margin Gaps -->
                <span class="connect-text-phrase">
                    Keep on Connect <span class="animated-dots"><span>.</span><span>.</span><span>.</span></span>
                </span>

                <!-- Right Star Icon -->
                <svg class="ticker-icon icon-star-right" viewBox="0 0 24 24">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
