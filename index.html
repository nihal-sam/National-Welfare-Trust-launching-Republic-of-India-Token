<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Three.js CDN for Photorealistic 3D Earth -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-page: #020617;
            --bg-surface: #0B1329;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.4);
            --india-green: #138808;
            --india-green-dark: #0E6B06;
            --india-blue: #1D4ED8;
            --india-blue-dark: #1E3A8A;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 3D WebGL Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Keep on Connect - Pure Text Alone */
        .connect-text-only {
            font-size: 22px;
            font-weight: 800;
            color: #60A5FA;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.6);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .connect-text-only:hover {
            color: #93C5FD;
            text-shadow: 0 0 30px rgba(147, 197, 253, 0.9);
            transform: translateY(-2px) scale(1.04);
        }

        /* Header Navigation - Full Solid Saffron Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            z-index: 1000;
            background: linear-gradient(135deg, #E67E22 0%, #D35400 100%);
            box-shadow: 0 4px 25px rgba(230, 126, 34, 0.4);
            border-bottom: 2px solid #CA6F1E;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 140px;
            padding-bottom: 100px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 48px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 54px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.5), 0 0 45px rgba(230, 126, 34, 0.35);
        }

        .title-line-2 {
            font-size: 34px;
            font-weight: 700;
            color: #E67E22;
            text-transform: lowercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(230, 126, 34, 0.7);
        }

        .title-line-3 {
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(19, 136, 8, 0.45);
            letter-spacing: -1px;
        }

        .hero-cta {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0B1329;
            border: 1px solid #1D4ED8;
            padding: 16px 24px;
            border-radius: 14px;
            color: #FFFFFF;
            font-weight: 700;
            box-shadow: 0 0 25px rgba(29, 78, 216, 0.4);
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Footer - Full India Green Bottom Band */
        footer {
            position: relative;
            z-index: 20;
            margin-top: auto;
            background: linear-gradient(135deg, #138808 0%, #0E6B06 100%);
            border-top: 3px solid #138808;
            padding: 30px 0;
            text-align: center;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 -4px 25px rgba(19, 136, 8, 0.4);
        }

        @media (max-width: 992px) {
            .title-line-1 { font-size: 38px; }
            .title-line-2 { font-size: 26px; }
            .title-line-3 { font-size: 42px; }
        }
    </style>
</head>
<body>

    <!-- 3D Real Earth Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Navigation Bar - Full Solid Saffron Bar -->
    <header></header>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                    
                    <div class="hero-cta">
                        <div class="connect-text-only" onclick="triggerDemoConnect()">
                            🔗 Keep on Connect
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Keep on Connect Active!</span>
    </div>

    <!-- Footer - Full Green Bottom Band -->
    <footer>
        <div class="container">
            &copy; 2026 National Welfare Trust. Republic of India Token.
        </div>
    </footer>

    <!-- Interactive Photorealistic 3D Earth Moving Animation Script -->
    <script>
        function initReal3DEarth() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            if (typeof THREE === 'undefined') {
                container.style.background = 'radial-gradient(circle at 50% 50%, #061933 0%, #020617 100%)';
                return;
            }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 1. GENERATE PHOTOREALISTIC EARTH TEXTURE MAP
            const earthCanvas = document.createElement('canvas');
            earthCanvas.width = 2048;
            earthCanvas.height = 1024;
            const eCtx = earthCanvas.getContext('2d');

            // Deep Realistic Ocean Blue Background
            const oceanGrad = eCtx.createLinearGradient(0, 0, 0, 1024);
            oceanGrad.addColorStop(0, '#02162E');
            oceanGrad.addColorStop(0.5, '#0A3B74');
            oceanGrad.addColorStop(1, '#02162E');
            eCtx.fillStyle = oceanGrad;
            eCtx.fillRect(0, 0, 2048, 1024);

            // Draw Continents Topography (Asia, India, Europe, Africa, Americas, Australia)
            eCtx.fillStyle = '#225227'; // Lush Green Landmass

            // Asia & Indian Subcontinent Region
            eCtx.beginPath();
            eCtx.ellipse(1420, 420, 280, 200, 0, 0, Math.PI * 2);
            eCtx.fill();

            // India Peninsula Detail
            eCtx.fillStyle = '#316B2D';
            eCtx.beginPath();
            eCtx.moveTo(1360, 410);
            eCtx.lineTo(1430, 520);
            eCtx.lineTo(1390, 560);
            eCtx.lineTo(1320, 480);
            eCtx.closePath();
            eCtx.fill();

            // Europe & Africa
            eCtx.fillStyle = '#204A23';
            eCtx.beginPath();
            eCtx.ellipse(1080, 360, 170, 120, 0, 0, Math.PI * 2); // Europe
            eCtx.ellipse(1060, 620, 200, 250, 0, 0, Math.PI * 2); // Africa
            eCtx.fill();

            // Americas
            eCtx.fillStyle = '#1E4721';
            eCtx.beginPath();
            eCtx.ellipse(540, 360, 230, 170, 0, 0, Math.PI * 2); // North America
            eCtx.ellipse(680, 680, 170, 250, 0, 0, Math.PI * 2); // South America
            eCtx.fill();

            // Australia & Indonesia Islands
            eCtx.fillStyle = '#5A5223';
            eCtx.beginPath();
            eCtx.ellipse(1680, 720, 150, 110, 0, 0, Math.PI * 2);
            eCtx.fill();

            // Glowing City Lights Overlay (Night side details)
            for (let i = 0; i < 750; i++) {
                let x = Math.random() * 2048;
                let y = Math.random() * 1024;
                eCtx.fillStyle = Math.random() > 0.4 ? '#FFB74D' : '#64B5F6';
                eCtx.fillRect(x, y, 2, 2);
            }

            // India Golden Light Cluster
            let ix = 1370, iy = 470;
            for(let i=0; i<100; i++) {
                let x = ix + (Math.random() - 0.5) * 80;
                let y = iy + (Math.random() - 0.5) * 60;
                eCtx.fillStyle = '#FFB74D';
                eCtx.beginPath();
                eCtx.arc(x, y, 2, 0, Math.PI * 2);
                eCtx.fill();
            }

            // Ice Caps
            eCtx.fillStyle = '#EAF4F4';
            eCtx.fillRect(0, 970, 2048, 54);
            eCtx.fillRect(0, 0, 2048, 35);

            const earthTexture = new THREE.CanvasTexture(earthCanvas);

            // 2. CREATE REALISTIC EARTH MESH
            const earthGeo = new THREE.SphereGeometry(1.35, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({
                map: earthTexture,
                shininess: 20,
                specular: new THREE.Color(0x224466)
            });
            const earth = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earth);

            // 3. PHOTOREALISTIC CLOUDS LAYER
            const cloudCanvas = document.createElement('canvas');
            cloudCanvas.width = 2048;
            cloudCanvas.height = 1024;
            const cCtx = cloudCanvas.getContext('2d');
            cCtx.fillStyle = 'transparent';
            cCtx.fillRect(0, 0, 2048, 1024);
            cCtx.fillStyle = 'rgba(255, 255, 255, 0.42)';

            for(let i=0; i<700; i++) {
                let cx = Math.random() * 2048;
                let cy = Math.random() * 1024;
                let rx = 35 + Math.random() * 100;
                let ry = 12 + Math.random() * 35;
                cCtx.beginPath();
                cCtx.ellipse(cx, cy, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
                cCtx.fill();
            }
            const cloudTexture = new THREE.CanvasTexture(cloudCanvas);

            const cloudGeo = new THREE.SphereGeometry(1.38, 64, 64);
            const cloudMat = new THREE.MeshPhongMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            const clouds = new THREE.Mesh(cloudGeo, cloudMat);
            scene.add(clouds);

            // 4. REALISTIC BLUE ATMOSPHERE HALO
            const atmosphereGeo = new THREE.SphereGeometry(1.44, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({
                color: 0x4080FF,
                transparent: true,
                opacity: 0.16,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
            scene.add(atmosphere);

            // 5. STARRY SPACE PARTICLES
            const starGeo = new THREE.BufferGeometry();
            const starCount = 500;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starPos[i] = (Math.random() - 0.5) * 10;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.02, color: 0xFFFFFF, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // 6. REALISTIC SUNLIGHTING
            const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.45);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xFFFFFF, 1.4);
            dirLight.position.set(5, 3, 5);
            scene.add(dirLight);

            // 7. REALISTIC SLOW PLANETARY ROTATION ANIMATION
            function animate() {
                requestAnimationFrame(animate);
                earth.rotation.y += 0.0012; // Slow, majestic real Earth rotation
                clouds.rotation.y += 0.0015; // Clouds drift slightly faster
                stars.rotation.y -= 0.0003;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* CONNECT DEMO HANDLER */
        function triggerDemoConnect() {
            showToast("🔗 Keep on Connect (Demo mode active for future launch)");
        }

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initReal3DEarth();
        });
    </script>
</body>
</html>
