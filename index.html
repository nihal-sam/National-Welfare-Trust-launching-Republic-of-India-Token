<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="National Welfare Trust launching Republic of India Token - Official Portal.">
    <title>National Welfare Trust launching Republic of India Token</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Three.js CDN for 3D Earth at Night -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-page: #030712;
            --bg-surface: #0B1329;
            --primary-saffron: #E67E22;
            --primary-saffron-dark: #D35400;
            --saffron-glow: rgba(230, 126, 34, 0.4);
            --india-green: #138808;
            --india-green-dark: #0E6B06;
            --india-blue: #1D4ED8;
            --india-blue-dark: #1E3A8A;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 3D WebGL Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 42px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            border: none;
        }

        /* Neon Royal Blue Keep on Connect Button */
        .btn-connect {
            background: linear-gradient(135deg, #1D4ED8 0%, #1E3A8A 100%);
            color: #FFFFFF;
            box-shadow: 0 0 25px rgba(29, 78, 216, 0.6), 0 6px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(96, 165, 250, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-connect:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 40px rgba(96, 165, 250, 0.8), 0 10px 35px rgba(29, 78, 216, 0.7);
            border-color: #60A5FA;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #60A5FA;
            box-shadow: 0 0 12px #60A5FA;
            animation: pulse-animation 1.8s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.9); }
            70% { box-shadow: 0 0 0 14px rgba(96, 165, 250, 0); }
            100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
        }

        /* Header Navigation - Full Solid Saffron Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            z-index: 1000;
            background: linear-gradient(135deg, #E67E22 0%, #D35400 100%);
            box-shadow: 0 4px 25px rgba(230, 126, 34, 0.4);
            border-bottom: 2px solid #CA6F1E;
        }

        /* Hero Section */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 140px;
            padding-bottom: 100px;
            text-align: center;
            z-index: 10;
        }

        .hero-centered-content {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroFadeReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3-Line Neon Title Styling */
        .hero-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-family: var(--font-display);
            line-height: 1.15;
            margin-bottom: 48px;
            text-align: center;
        }

        .title-line-1 {
            font-size: 54px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.5), 0 0 45px rgba(230, 126, 34, 0.35);
        }

        .title-line-2 {
            font-size: 34px;
            font-weight: 700;
            color: #E67E22;
            text-transform: lowercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(230, 126, 34, 0.7);
        }

        .title-line-3 {
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(19, 136, 8, 0.45);
            letter-spacing: -1px;
        }

        .hero-cta {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0B1329;
            border: 1px solid #1D4ED8;
            padding: 16px 24px;
            border-radius: 14px;
            color: #FFFFFF;
            font-weight: 700;
            box-shadow: 0 0 25px rgba(29, 78, 216, 0.4);
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Footer - Full India Green Bottom Band */
        footer {
            position: relative;
            z-index: 20;
            margin-top: auto;
            background: linear-gradient(135deg, #138808 0%, #0E6B06 100%);
            border-top: 3px solid #138808;
            padding: 30px 0;
            text-align: center;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 -4px 25px rgba(19, 136, 8, 0.4);
        }

        @media (max-width: 992px) {
            .title-line-1 { font-size: 38px; }
            .title-line-2 { font-size: 26px; }
            .title-line-3 { font-size: 42px; }
        }
    </style>
</head>
<body>

    <!-- 3D Earth at Night Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Navigation Bar - Full Solid Saffron Bar -->
    <header></header>

    <main style="display: flex; flex-direction: column; flex: 1;">
        <!-- Home Hero Section -->
        <section id="home" class="hero">
            <div class="container">
                <div class="hero-centered-content">
                    <h1 class="hero-title">
                        <span class="title-line-1">National Welfare Trust</span>
                        <span class="title-line-2">launching</span>
                        <span class="title-line-3">Republic of India Token</span>
                    </h1>
                    
                    <div class="hero-cta">
                        <button class="btn btn-connect" onclick="triggerDemoConnect()">
                            <span class="pulse-dot"></span> 🔗 Keep on Connect
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Keep on Connect Active!</span>
    </div>

    <!-- Footer - Full Green Bottom Band -->
    <footer>
        <div class="container">
            &copy; 2026 National Welfare Trust. Republic of India Token.
        </div>
    </footer>

    <!-- Interactive 3D Earth at Night WebGL Script -->
    <script>
        function init3DEarth() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            if (typeof THREE === 'undefined') {
                container.style.background = 'radial-gradient(circle at 50% 50%, #0c1a30 0%, #030712 100%)';
                return;
            }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.6;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create 3D Earth Sphere Geometry
            const geometry = new THREE.SphereGeometry(1.35, 64, 64);
            
            // Procedural Glowing Night City Lights & Continent Texture
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#030814';
            ctx.fillRect(0, 0, 1024, 512);

            // Procedural landmass silhouettes
            ctx.fillStyle = '#0B1B32';
            for (let i = 0; i < 350; i++) {
                let x = Math.random() * 1024;
                let y = Math.random() * 512;
                let r = 15 + Math.random() * 45;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Neon Night City Lights Nodes
            for (let i = 0; i < 900; i++) {
                let x = Math.random() * 1024;
                let y = Math.random() * 512;
                ctx.fillStyle = Math.random() > 0.4 ? '#E67E22' : '#2563EB';
                ctx.fillRect(x, y, 2, 2);
            }

            // Highlighted India Glowing City Cluster
            let ix = 690, iy = 230;
            for(let i=0; i<140; i++) {
                let x = ix + (Math.random() - 0.5) * 70;
                let y = iy + (Math.random() - 0.5) * 55;
                ctx.fillStyle = i % 2 === 0 ? '#FF9933' : '#138808';
                ctx.beginPath();
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshPhongMaterial({
                map: texture,
                emissive: new THREE.Color(0x0a1e36),
                shininess: 30
            });

            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // Glowing Outer Atmosphere Ring
            const atmosphereGeo = new THREE.SphereGeometry(1.42, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({
                color: 0x1d4ed8,
                transparent: true,
                opacity: 0.22,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
            scene.add(atmosphere);

            // Neon Saffron Orbit Ring
            const ringGeo = new THREE.RingGeometry(1.65, 1.67, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xe67e22, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.3;
            scene.add(ring);

            // Floating Space Particles
            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 450;
            const posArray = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount*3; i++) {
                posArray[i] = (Math.random() - 0.5) * 9;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({ size: 0.025, color: 0x60a5fa, transparent: true, opacity: 0.75 });
            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesMesh);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xe67e22, 1.8, 100);
            pointLight.position.set(5, 3, 5);
            scene.add(pointLight);

            // Continuous Rotation Animation
            function animate() {
                requestAnimationFrame(animate);
                earth.rotation.y += 0.0025;
                ring.rotation.z += 0.0018;
                particlesMesh.rotation.y -= 0.0008;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* CONNECT DEMO HANDLER */
        function triggerDemoConnect() {
            showToast("🔗 Keep on Connect (Demo mode active for future launch)");
        }

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            init3DEarth();
        });
    </script>
</body>
</html>
